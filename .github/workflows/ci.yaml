name: CI workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v3

  - name: Set up Node.js
    uses: actions/setup-node@v3
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Run lint
    run: npm run lint

  - name: Run typecheck
    run: npm run typecheck

  - name: Run format check
    run: npm run format:check
    